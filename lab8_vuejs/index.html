<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secured SPA Frontend VueJS</title>

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<div id="app">

    <header>

        <h1>📰 Aplikasi Panel Single Page (SPA) Secured</h1>

        <nav class="nav-menu">

            <router-link to="/">Beranda</router-link>

            <router-link to="/artikel">
                Kelola Artikel
            </router-link>

            <router-link to="/about">
                About Me
            </router-link>

            <router-link
                v-if="!isLoggedIn"
                to="/login">
                Login
            </router-link>

            <a
                v-else
                href="#"
                @click.prevent="logout">
                Logout
            </a>

        </nav>

    </header>

    <main>

        <router-view></router-view>

    </main>

</div>

<script src="assets/js/components/Home.js?v=2"></script>
<script src="assets/js/components/Artikel.js?v=2"></script>
<script src="assets/js/components/About.js?v=2"></script>
<script src="assets/js/components/Login.js?v=2"></script>
<script src="assets/js/app.js?v=2"></script>

</body>
</html>
